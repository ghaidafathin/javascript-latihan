<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta viewport="width=device-width, initial-scale=1.0">
        <title> Event Listener Java Script </title>
    </head>

    <body>

        <!-- ======== TEST CHALLENGE 1 ==========-->
        <h1 id="nama"> Welcome! What's your name? </h1>

        <input
        type="text"
        name="nama"
        id="inputNama"
        placeholder="masukkan nama">

        <button id="tampilkan">
            Submit Nama
        </button>

        <!-- ======== TEST CHALLENGE 2 ==========-->
        <h2 id="umur"> How old are you? </h2>

        <input
        type="text"
        name="umur"
        id="inputUmur"
        placeholder="masukkan umur">

        <button id="tampilkanUmur">
            Submit Umur
        </button>

        <!-- ======== TEST CHALLENGE 3 ==========-->
        <h3 id="formNama"> Insert your Name, Last Name </h3>

        <input
        type="text"
        name="form_nama"
        id="inputNamaForm"
        placeholder="Nama, Nama Belakang">

        <h3 id="formUmur"> Insert your age (ex. 20) </h3>

        <input
        type="text"
        name="form_umur"
        id="inputUmurForm"
        placeholder="Umur">

        <button id="inputNamaUmur">
            Input
        </button>

        <h3 id="formSimple"></h3>

        <script src="script_eventlistener.js"></script>

    </body>
</html>
