<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta viewport="width=device-width, initial-scale=1.0">
        <title> Input JavaScript </title>
    </head>

    <body>

        <!-- ===== TESTING ===== -->
        <h1> Hello, <span id="judul">User</span> </h1>

        <input
        type="text"
        name="nama"
        id="namaUser"
        placeholder="Ketik Nama"
        >

        <button onclick="tampilkanNama()">
            Tampilkan Nama
        </button>

        <!-- ===== CHALLENGE 1 ===== -->
        <h2 id="masukkanNama"> Masukkan Nama: </h2>

        <input
        type="text"
        name="masukkanNama"
        id="inputNama"
        placeholder="Ketik namamu disini"
        >

        <button onclick="submit1()">
            Enter
        </button>

        <!-- ===== CHALLENGE 2 ===== -->
        <h2 id="masukkanUmur"> Masukkan Umur: </h2>

        <input
        type="text"
        name="masukkanUmur"
        id="inputUmur"
        placeholder="Ketik umurmu disini"
        >

        <button onclick="submit2()">
            Enter
        </button>

        <!-- ===== CHALLENGE 3 ===== -->
        <h2 id="namaBaru"> Masukkan Nama: </h2>

        <input
        type="text"
        name="namaBaru"
        id="inputNamaBaru"
        placeholder="Ketik namamu disini"
        >
        
        <h2 id="umurBaru"> Masukkan Umur: </h2>

        <input
        type="text"
        name="umurBaru"
        id="inputUmurBaru"
        placeholder="Ketik umurmu disini"
        >

        <button onclick="submit3()">
            Enter
        </button>

        <h2 id="hasilBaru"></h2>

        <script src="script.js"></script>

    </body>
</html>
