<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta viewport="width=device-width, initial-scale=1.0">
        <title> LATIHAN JavaScript </title>
    </head>

    <body>

        <!-- ====== LATIHAN 1 ===== -->
        <span id="angka"> Masukkan angka </span>
        <br>
        <input
        type="text"
        name="angka"
        id="inputAngka"
        placeholder="Masukkan Angka">

        <button id="submitAngka">
            Cek Angka
        </button>
        <br>
        <span id="hasilAngka"></span>
        <br> <br>

        <!-- ====== LATIHAN 2 ===== -->
        <span id="nilai"> Masukkan nilai </span>
        <br>
        <input
        type="text"
        name="nilai"
        id="inputNilai"
        placeholder="Masukkan Nilai">

        <button id="submitNilai">
            Cek Grade
        </button>
        <br>
        <span id="hasilNilai"></span>
        <br> <br>

        <!-- ====== LATIHAN 3 ===== -->
        <span id="deretAngka"> Masukkan angka </span>
        <br>
        <input
        type="text"
        name="deretAngka"
        id="inputDeretAngka"
        placeholder="Masukkan Angka">

        <button id="submitDeretAngka">
            Tampilkan
        </button>
        <br>
        <span id="hasilDeretAngka"></span>
        <br> <br>

        <!-- ====== LATIHAN 4 ===== -->
        <span id="perkalian"> Masukkan angka </span>
        <br>
        <input
        type="text"
        name="perkalian"
        id="inputAngkaPerkalian"
        placeholder="Masukkan Angka">

        <button id="submitAngkaPerkalian">
            Tampilkan
        </button>
        <br>
        <span id="hasilAngkaPerkalian"></span>
        <br> <br>

        <!-- ====== LATIHAN 5 ===== -->
        <span id="login"> Login </span>
        <br>
        <input
        type="text"
        name="username"
        id="inputUsername"
        placeholder="Masukkan Username">
        <br>
        <input
        type="password"
        name="password"
        id="inputPassword"
        placeholder="Masukkan Password">   
        <br>
        <button id="submitLogin">
            Tampilkan
        </button>
        <br>
        <h1 id="hasilLogin"></h1>
        <br> <br>

        <script src="script_latihan.js"></script>
    </body>
</html>
