<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta viewport="width=device-width, initial-scale=1.0">
        <title> Latihan After Break </title>
    </head>

    <body>

        <!-- ====== LATIHAN 1 =====-->
        <h1 id="inputAngka"> Masukkan Angka: </h1>
        <input
        type="text"
        id="angka"
        name="angka"
        placeholder="Masukkan Angka Di sini">
        <button id="submit">
            Submit
        </button>
        <br>
        <span id="hasil"></span>

        <!-- ====== LATIHAN 2 =====-->
        <h1 id="inputNilai"> Masukkan Nilai: </h1>
        <input
        type="text"
        id="nilai"
        name="nilai"
        placeholder="Masukkan Nilai Di sini">
        <button id="cekNilai">
            Cek Grade
        </button>
        <br>
        <span id="hasilNilai"></span>

        <!-- ====== LATIHAN 3 =====-->
        <h1 id="cekAngka"> Masukkan Angka: </h1>
        <input
        type="text"
        id="lihatAngka"
        name="lihatAngka"
        placeholder="Masukkan Angka Di sini">
        <button id="tampilkanAngka">
            Tampilkan Deret Angka
        </button>
        <br>
        <span id="hasilAngka"></span>

        <script src="script.js"></script>
    </body>
</html>
